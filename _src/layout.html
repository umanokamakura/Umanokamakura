<script>
/* ❅ をすばやく5回クリックすると……？ */
(function () {
    var crown = document.getElementById("crown");
    if (!crown) return;
    var count = 0, timer = null;
    crown.addEventListener("click", function () {
        count++;
        crown.style.transform = "rotate(" + (count * 72) + "deg) scale(" + (1 + count * 0.08) + ")";
        clearTimeout(timer);
        if (count >= 5) {
            crown.classList.add("crown-open");
            setTimeout(function () { location.href = "{{secret_url}}"; }, 700);
            return;
        }
        timer = setTimeout(function () { count = 0; crown.style.transform = ""; }, 1500);
    });
})();
</script>
